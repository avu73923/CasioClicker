function gateRegister(){
  gate('<h2>Tạo tài khoản</h2><p class="sub">Chọn tên người chơi. Tên này hiện trên bảng xếp hạng. Tài khoản này là tài khoản Firebase; hãy liên kết Google trong Hồ sơ để giữ tài khoản và chơi trên máy khác.</p>'
    +'<form id="regForm"><label for="regName">Tên người chơi</label><input id="regName" maxlength="16" autocomplete="off" placeholder="Ví dụ: Casio_Hero"><p class="err" id="regErr"></p><button class="btn big" id="regBtn" type="submit">Đăng ký và chơi</button></form>');
  $('#regForm').addEventListener('submit',registerSubmit);
}
async function registerSubmit(ev){
  ev.preventDefault();
  const name=$('#regName').value.trim(),err=$('#regErr'),btn=$('#regBtn');
  if(!/^[A-Za-z0-9_]{3,16}$/.test(name)){err.textContent='Tên dài 3 đến 16 ký tự, chỉ gồm chữ không dấu, số và dấu gạch dưới.';return;}
  btn.disabled=true;err.textContent='';
  try{
    const uref=DB.doc('usernames/'+name.toLowerCase());
    const l=await uref.acquire({holder:UID,ttlMs:8000});
    if(!l.acquired){err.textContent='Tên này đang được người khác đăng ký, hãy thử lại sau vài giây.';btn.disabled=false;return;}
    const cur=await uref.get(),d=cur.exists?cur.data():null;
    if(d&&d.uid&&d.uid!==UID){err.textContent='Tên đã có người dùng. Hãy chọn tên khác.';btn.disabled=false;return;}
    await uref.set({uid:UID,name:name});
    S=blank(name);await DB.doc('players/'+UID).set(ser());
    startGame();
  }catch(e){err.textContent='Không tạo được tài khoản ('+((e&&e.code)||'lỗi')+'). Hãy thử lại.';btn.disabled=false;}
}
function gateLogin(d){
  const s=sane(d);
  gate('<h2>Chào mừng trở lại, '+esc(s.name)+'</h2><p class="sub">Tốc độ cao nhất: <b>'+fmt(s.peak)+'</b> · Vàng: <b>'+fmt(s.gold)+'</b> · Máy chạy bộ: <b>'+s.tm+'</b></p><button class="btn big" data-g="login">Đăng nhập và chơi</button>');
  $('#gateCard').querySelector('[data-g="login"]').addEventListener('click',()=>{S=s;startGame();});
}
function gateOffline(msg){
  const outside=!window.claude;   // opened on a normal website: this is the Claude Artifact build, which has no Google/Firebase sign-in
  gate('<h2>Chưa đăng nhập được</h2><p class="sub">'+esc(msg)+'</p>'+(outside?'<p class="sub" style="color:#ffd36b;font-weight:800">Bạn đang mở bản Artifact (chỉ chạy trong Claude). Muốn có Đăng nhập bằng Google, hãy tải lên web file <b>index.html</b> của gói Firebase, không phải casio-click.html.</p>':'')+'<button class="btn big" data-g="offline">Chơi thử offline</button><p class="sub">Chế độ offline chỉ lưu trong trình duyệt này và không lên bảng xếp hạng.</p>');
  $('#gateCard').querySelector('[data-g="offline"]').addEventListener('click',()=>{
    offline=true;let d={};try{d=JSON.parse(localStorage.getItem('cc-offline')||'{}')||{};}catch(e){}
    S=sane(d,'Khách');startGame();});
}
function startGame(){
  $('#gate').hidden=true;playing=true;lastEcon=Date.now();
  const away=Math.min((Date.now()-S.seen)/1000,4*3600),gain=rate()*away*0.5;
  if(away>60&&gain>=1){addSpeed(gain);toast('Lúc bạn vắng mặt, máy chạy bộ kiếm được '+fmt(gain)+' tốc độ');}
  S.seen=Date.now();
  {const n=boneCatchUp(Date.now());if(n)toast('Hôm nay có '+n+' mảnh xương mới trên bản đồ!');}
  if(S.mgN){toast('Pet của phiên bản cũ đã được đổi thành '+S.mgN+' quả trứng. Vào Ổ ấp để ấp.');S.mgN=0;dirty=true;}
  logNote('Dev game: '+DEV_NAME+' · Admin: '+DEV_ADMIN);
  $('#whoName').hidden=false;$('#whoText').textContent=S.name+(offline?' (offline)':'');$('#whoAv').textContent=S.name.charAt(0).toUpperCase();
  if(GL)GL.setPets(S.eq);else $('#btnPress').hidden=false;
  renderTabs();renderPanel();refreshHud();
  if(GL)GL.relayout();
  if(window.FB&&window.FB.configured&&!offline)S.lk=FB.email()?1:0;   // the truth is Firebase's provider list
  initEvents();initInbox();initRace();if(S.lk)refreshAdmin();
  if(!offline)subscribeBoard();
  dirty=true;
}
async function cap(n){try{return window.claude&&window.claude.use?await window.claude.use(n):null;}catch(e){return null;}}
function fbGate(msg){
  // The Google button is ALWAYS shown. If Firebase is not configured yet, it explains what is missing instead of hiding the sign-in.
  const cfgOk=FB.configured;
  const why=!FB.sdk?'Không tải được thư viện Firebase (gstatic.com). Hãy kiểm tra mạng, hoặc trang đang bị chặn tải script ngoài.':'Chưa dán cấu hình Firebase nên chưa đăng nhập được. Chủ web: mở index.html, điền khối FIREBASE_CONFIG (xem README), hoặc dán tạm cấu hình vào ô bên dưới để thử trên trình duyệt này.';
  gate('<h2>Đăng nhập</h2><p class="sub">Đăng nhập bằng Google để giữ tài khoản ở mọi thiết bị, hoặc chơi nhanh bằng tài khoản khách rồi liên kết Google sau.</p><p class="err" id="fbErr">'+esc(msg||(cfgOk?'':why))+'</p>'
    +'<button class="btn big" data-g="google">Đăng nhập bằng Google</button><button class="btn big line" data-g="guest">Chơi bằng tên (khách)</button>'
    +(cfgOk||!FB.sdk?'':'<details open style="margin-top:10px"><summary style="cursor:pointer;font-weight:800">Dán cấu hình Firebase (thử nhanh)</summary><textarea id="fbCfg" rows="6" style="width:100%;margin-top:6px;font:12px/1.3 monospace;border:3px solid var(--navy);border-radius:10px;padding:6px" placeholder="Dán đoạn firebaseConfig (apiKey, authDomain, projectId, appId...)"></textarea><button class="btn sm" data-g="savecfg" style="margin-top:6px">Lưu và tải lại</button></details>'));
  const c=$('#gateCard'),err=$('#fbErr');
  const need=()=>{if(FB.configured)return false;err.textContent=why;return true;};
  c.querySelector('[data-g="google"]').addEventListener('click',async()=>{if(need())return;try{await FB.signInGoogle();boot();}catch(e){err.textContent=fbErr(e);}});
  c.querySelector('[data-g="guest"]').addEventListener('click',async()=>{if(need())return;try{await FB.signInGuest();boot();}catch(e){err.textContent=fbErr(e);}});
  const sv=c.querySelector('[data-g="savecfg"]');
  if(sv)sv.addEventListener('click',()=>{if(FB.saveConfig($('#fbCfg').value))location.reload();else err.textContent='Cấu hình chưa đủ: cần apiKey, projectId (và authDomain, appId).';});
}
async function boot(){
  renderTabs();
  if(window.FB){
    if(!FB.configured){fbGate();return;}
    gate('<h2>Đang kết nối</h2><p class="sub">Đang kiểm tra tài khoản Firebase.</p>');
    await Promise.race([FB.ready(),new Promise(r=>setTimeout(r,10000))]);
    if(!FB.user()){fbGate();return;}
  }
  gate('<h2>Đang kết nối</h2><p class="sub">Đang kiểm tra tài khoản của bạn.</p>');
  let done=false;
  const timer=setTimeout(()=>{if(!done){done=true;gateOffline('Chưa kết nối được máy chủ lưu dữ liệu sau 10 giây.');}},10000);
  const r=await Promise.all([cap('db'),cap('user')]),d=r[0],u=r[1];
  if(done)return;
  let id=null,cw=null;
  if(u){try{id=await u.id();}catch(e){}try{cw=await u.can('data.write');}catch(e){}}
  if(done)return;
  const stop=()=>{clearTimeout(timer);done=true;};
  if(!d||!id){stop();gateOffline('Bạn cần đăng nhập để dùng tài khoản và bảng xếp hạng.');return;}
  if(cw===false){stop();gateOffline('Quyền hiện tại chỉ cho xem, chưa thể lưu dữ liệu. Chủ trang cần cấp quyền Contributor.');return;}
  DB=d;UID=id;
  try{
    const snap=await DB.doc('players/'+UID).get();
    if(done)return;stop();
    if(snap.exists)gateLogin(snap.data());else gateRegister();
  }catch(e){if(!done){stop();gateOffline('Không đọc được dữ liệu tài khoản.');}}
}
boot();
})();
</script>
